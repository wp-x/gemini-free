name: Desktop build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and vet
        run: |
          perl -e 'alarm 60; exec @ARGV' go test -race -count=1 -timeout 60s ./internal/... ./desktop/... ./cmd/...
          go vet ./internal/... ./desktop/... ./cmd/...
      - name: Install Windows packaging tools
        run: brew install makensis
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/.*version: "\([^"]*\)".*/\1/p' mygo.config.ts)
          test "$GITHUB_REF_NAME" = "v$version"
          grep -q "desktopVersion.*= \"$version\"" desktop/desktop.go
      - name: Build both platforms
        run: bash scripts/build-desktop.sh
      - name: Collect installers
        run: |
          mkdir release-assets
          for artifact in dist/darwin-universal/*.dmg dist/windows-amd64/*.exe; do
            name=$(basename "$artifact")
            cp "$artifact" "release-assets/${name// /.}"
          done
          cd release-assets
          shasum -a 256 *.dmg *.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-Free-desktop
          path: release-assets/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Gemini-Free-desktop
          path: release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --draft --title "Gemini Free $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
